<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/flash-ai-mark.svg" />
    <link rel="apple-touch-icon" href="/flash-ai-mark.svg" />
    <meta name="theme-color" content="#07111f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash AI - Your Intelligent AI Assistant</title>
    <meta name="description" content="Flash AI is your intelligent assistant for text, images, and videos. Generate stunning AI images, create videos, and chat with advanced AI models." />
    <style>
      #file-open-guide { display: none; }
      html[data-file-open="true"] #file-open-guide {
        box-sizing: border-box;
        display: grid;
        gap: 0.75rem;
        max-width: 38rem;
        margin: 12vh auto;
        padding: 2rem;
        color: #e5e7eb;
        background: #0b0f19;
        border: 1px solid #263244;
        font: 16px/1.6 system-ui, sans-serif;
      }
      html[data-file-open="true"] #file-open-guide h1 { margin: 0; font-size: 1.5rem; }
      html[data-file-open="true"] #file-open-guide p { margin: 0; color: #aab4c2; }
      html[data-file-open="true"] #file-open-guide code { color: #67e8f9; }
    </style>
    <script>
      if (window.location.protocol === 'file:') {
        document.documentElement.dataset.fileOpen = 'true';
      }
    </script>
  </head>
  <body class="dark:bg-gray-900">
    <div id="root">
      <main id="file-open-guide" role="alert">
        <h1>Flash AI needs the development server</h1>
        <p>This source page cannot run directly from <code>file://</code>. Start the app from the project folder with <code>corepack pnpm dev</code>, then open <code>http://localhost:5173</code>.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
